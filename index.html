<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse; width: 50%; text-align: center; border-color: red;">
        <caption>Student Scores</caption>

        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Score</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Kamsi</td>
                <td>Frontend</td>
                <td>100</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>Munachi</td>
                <td>Backend</td>
                <td>100</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>Esther</td>
                <td>Full Stack</td>
                <td>100</td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td>Prince</td>

    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea name="message" id="message" required></textarea>
    </form>
</body>
